<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ねこキャッチ！ | G.B.G</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#10131b;
  font-family:Arial,sans-serif;
  color:white;
}

#game{
  position:relative;
  width:100%;
  height:100dvh;
  max-width:600px;
  margin:auto;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 10%,#33486a 0%,transparent 35%),
    linear-gradient(#151c2d 0%,#25233a 65%,#15131d 100%);
}

/* 星 */
.star{
  position:absolute;
  color:white;
  opacity:.45;
  pointer-events:none;
}

/* 上部UI */
#hud{
  position:absolute;
  top:env(safe-area-inset-top,10px);
  left:0;
  width:100%;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  z-index:20;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#score{
  font-size:22px;
}

#life{
  font-size:21px;
}

#combo{
  position:absolute;
  top:70px;
  width:100%;
  text-align:center;
  font-size:24px;
  font-weight:900;
  color:#ffd84a;
  opacity:0;
  z-index:20;
  transition:.15s;
}

/* 地面 */
#ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:16%;
  background:linear-gradient(#28222e,#17141c);
  border-top:3px solid #44394c;
}

/* ネコ */
#cat{
  position:absolute;
  bottom:8%;
  left:50%;
  transform:translateX(-50%);
  width:92px;
  height:92px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:78px;
  z-index:10;
  filter:drop-shadow(0 7px 5px rgba(0,0,0,.5));
  transition:transform .08s;
}

#cat.hit{
  transform:translateX(-50%) scale(.8) rotate(-10deg);
}

/* 落下物 */
.item{
  position:absolute;
  width:58px;
  height:58px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:48px;
  z-index:8;
  filter:drop-shadow(0 5px 3px rgba(0,0,0,.4));
}

.gold{
  filter:
    drop-shadow(0 0 8px #ffd700)
    drop-shadow(0 0 18px #ff9d00);
}

/* ポイント表示 */
.popup{
  position:absolute;
  font-size:24px;
  font-weight:900;
  pointer-events:none;
  z-index:30;
  animation:pop .7s forwards;
}

@keyframes pop{
  0%{transform:translateY(0) scale(.7);opacity:1}
  100%{transform:translateY(-70px) scale(1.3);opacity:0}
}

/* スタート・ゲームオーバー */
.overlay{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
  background:rgba(7,8,13,.88);
  backdrop-filter:blur(5px);
}

.titleCat{
  font-size:100px;
  margin-bottom:0;
  animation:float 2s ease-in-out infinite;
}

@keyframes float{
  50%{transform:translateY(-10px)}
}

h1{
  margin:5px 0;
  font-size:38px;
}

.goldText{
  color:#ffd52a;
}

.description{
  line-height:1.8;
  color:#ccc;
  font-size:15px;
}

button{
  margin-top:20px;
  width:min(330px,90%);
  border:0;
  border-radius:18px;
  padding:18px;
  font-size:21px;
  font-weight:900;
  background:#ffd522;
  color:#111;
  box-shadow:0 6px 0 #aa7900;
}

button:active{
  transform:translateY(5px);
  box-shadow:0 1px 0 #aa7900;
}

#finalScore{
  font-size:55px;
  font-weight:900;
  color:#ffd522;
}

#best{
  color:#aaa;
  margin-top:8px;
}

.hidden{
  display:none;
}

/* フィーバー */
#fever{
  position:absolute;
  inset:0;
  pointer-events:none;
  border:0 solid #ffd700;
  z-index:40;
}

#fever.active{
  animation:fever .4s infinite alternate;
}

@keyframes fever{
  from{
    box-shadow:inset 0 0 25px #ffd700;
  }
  to{
    box-shadow:inset 0 0 70px #ff8a00;
  }
}

#feverText{
  position:absolute;
  top:115px;
  width:100%;
  text-align:center;
  font-size:31px;
  font-weight:900;
  color:#ffd700;
  z-index:50;
  opacity:0;
  text-shadow:0 0 15px #ff8a00;
}
</style>
</head>

<body>

<div id="game">

  <div id="hud">
    <div id="score">SCORE 0</div>
    <div id="life">❤️❤️❤️</div>
  </div>

  <div id="combo">COMBO × 0</div>
  <div id="feverText">✨ FEVER TIME! ✨</div>
  <div id="fever"></div>

  <div id="cat">🐱</div>
  <div id="ground"></div>

  <div id="startScreen" class="overlay">
    <div class="titleCat">🐱</div>

    <h1>
      ねこ<span class="goldText">キャッチ！</span>
    </h1>

    <div class="description">
      🐟 魚をキャッチしてポイントGET！<br>
      ✨ 金の魚は高得点！<br>
      💣 爆弾には気をつけろ！<br><br>
      画面を左右になぞってネコを動かそう
    </div>

    <button id="startBtn">GAME START</button>
  </div>

  <div id="gameOver" class="overlay hidden">
    <div style="font-size:70px">😿</div>
    <h1>GAME OVER</h1>

    <div>YOUR SCORE</div>
    <div id="finalScore">0</div>
    <div id="best">BEST 0</div>

    <button id="retryBtn">もう一回！</button>
  </div>

</div>

<script>
const game = document.getElementById("game");
const cat = document.getElementById("cat");
const scoreEl = document.getElementById("score");
const lifeEl = document.getElementById("life");
const comboEl = document.getElementById("combo");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

const finalScoreEl = document.getElementById("finalScore");
const bestEl = document.getElementById("best");

const fever = document.getElementById("fever");
const feverText = document.getElementById("feverText");

let playing = false;
let score = 0;
let lives = 3;
let combo = 0;

let catX = 0;
let spawnTimer;
let difficultyTimer;

let spawnRate = 850;
let speedBase = 3.3;

let feverMode = false;
let feverTimeout;

function createStars(){
  for(let i=0;i<30;i++){
    const s=document.createElement("div");
    s.className="star";
    s.textContent="•";
    s.style.left=Math.random()*100+"%";
    s.style.top=Math.random()*70+"%";
    s.style.fontSize=(10+Math.random()*20)+"px";
    game.appendChild(s);
  }
}

createStars();

function setCatPosition(clientX){
  const rect=game.getBoundingClientRect();

  let x=clientX-rect.left;

  const half=46;
  x=Math.max(half,Math.min(rect.width-half,x));

  catX=x;
  cat.style.left=x+"px";
}

game.addEventListener("pointerdown",e=>{
  if(!playing)return;
  setCatPosition(e.clientX);
});

game.addEventListener("pointermove",e=>{
  if(!playing || e.buttons===0)return;
  setCatPosition(e.clientX);
});

function updateHUD(){
  scoreEl.textContent="SCORE "+score;

  lifeEl.textContent=
    "❤️".repeat(Math.max(0,lives))+
    "🖤".repeat(Math.max(0,3-lives));

  if(combo>=2){
    comboEl.style.opacity=1;
    comboEl.textContent="COMBO × "+combo;
  }else{
    comboEl.style.opacity=0;
  }
}

function spawnItem(){

  if(!playing)return;

  const item=document.createElement("div");
  item.className="item";

  const random=Math.random();

  let type;
  let emoji;

  if(random<0.14){
    type="bomb";
    emoji="💣";
  }
  else if(random<0.25){
    type="gold";
    emoji="🐠";
    item.classList.add("gold");
  }
  else{
    type="fish";
    emoji="🐟";
  }

  item.dataset.type=type;
  item.textContent=emoji;

  const maxX=game.clientWidth-60;

  item.style.left=
    Math.max(2,Math.random()*maxX)+"px";

  item.style.top="-70px";

  game.appendChild(item);

  let y=-70;

  const speed=
    speedBase+
    Math.random()*1.8+
    (feverMode ? 1.5 : 0);

  function fall(){

    if(!playing){
      item.remove();
      return;
    }

    y+=speed;
    item.style.top=y+"px";

    const itemRect=item.getBoundingClientRect();
    const catRect=cat.getBoundingClientRect();

    const hit=
      itemRect.bottom>catRect.top+15 &&
      itemRect.top<catRect.bottom &&
      itemRect.right>catRect.left+12 &&
      itemRect.left<catRect.right-12;

    if(hit){
      collect(item,type);
      return;
    }

    if(y>game.clientHeight){
      item.remove();

      if(type!=="bomb"){
        combo=0;
        updateHUD();
      }

      return;
    }

    requestAnimationFrame(fall);
  }

  requestAnimationFrame(fall);
}

function collect(item,type){

  const rect=item.getBoundingClientRect();
  const gameRect=game.getBoundingClientRect();

  if(type==="bomb"){

    lives--;
    combo=0;

    popup(
      "💥 -1 LIFE",
      rect.left-gameRect.left,
      rect.top-gameRect.top,
      "#ff5353"
    );

    cat.classList.add("hit");

    setTimeout(()=>{
      cat.classList.remove("hit");
    },180);

    if(navigator.vibrate){
      navigator.vibrate(120);
    }

    if(lives<=0){
      item.remove();
      updateHUD();
      endGame();
      return;
    }

  }else{

    combo++;

    let points=100;

    if(type==="gold"){
      points=500;
    }

    const multiplier=
      Math.min(5,1+Math.floor(combo/5));

    points*=multiplier;

    if(feverMode){
      points*=2;
    }

    score+=points;

    popup(
      "+"+points,
      rect.left-gameRect.left,
      rect.top-gameRect.top,
      type==="gold" ? "#ffd700" : "#ffffff"
    );

    if(combo===10 || combo===25){
      startFever();
    }
  }

  item.remove();
  updateHUD();
}

function popup(text,x,y,color){

  const p=document.createElement("div");

  p.className="popup";
  p.textContent=text;

  p.style.left=x+"px";
  p.style.top=y+"px";
  p.style.color=color;

  game.appendChild(p);

  setTimeout(()=>{
    p.remove();
  },700);
}

function startFever(){

  if(feverMode)return;

  feverMode=true;

  fever.classList.add("active");
  feverText.style.opacity=1;

  clearTimeout(feverTimeout);

  feverTimeout=setTimeout(()=>{
    feverMode=false;
    fever.classList.remove("active");
    feverText.style.opacity=0;
  },5000);
}

function startGame(){

  document
    .querySelectorAll(".item,.popup")
    .forEach(el=>el.remove());

  score=0;
  lives=3;
  combo=0;

  spawnRate=850;
  speedBase=3.3;
  feverMode=false;

  fever.classList.remove("active");
  feverText.style.opacity=0;

  playing=true;

  startScreen.classList.add("hidden");
  gameOverScreen.classList.add("hidden");

  catX=game.clientWidth/2;
  cat.style.left=catX+"px";

  updateHUD();

  scheduleSpawn();

  difficultyTimer=setInterval(()=>{

    spawnRate=Math.max(330,spawnRate-65);
    speedBase=Math.min(8,speedBase+.35);

  },5000);
}

function scheduleSpawn(){

  if(!playing)return;

  spawnItem();

  const next=
    feverMode
      ? Math.max(180,spawnRate*.45)
      : spawnRate;

  spawnTimer=setTimeout(
    scheduleSpawn,
    next
  );
}

function endGame(){

  playing=false;

  clearTimeout(spawnTimer);
  clearInterval(difficultyTimer);
  clearTimeout(feverTimeout);

  feverMode=false;
  fever.classList.remove("active");
  feverText.style.opacity=0;

  document
    .querySelectorAll(".item")
    .forEach(el=>el.remove());

  let best=
    Number(localStorage.getItem("gbgCatBest")||0);

  if(score>best){
    best=score;
    localStorage.setItem("gbgCatBest",best);
  }

  finalScoreEl.textContent=score;
  bestEl.textContent="BEST "+best;

  gameOverScreen.classList.remove("hidden");
}

document
  .getElementById("startBtn")
  .addEventListener("click",startGame);

document
  .getElementById("retryBtn")
  .addEventListener("click",startGame);

</script>

</body>
</html>
