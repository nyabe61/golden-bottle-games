<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOLDEN BOTTLE GAMES</title>

<style>
  .gbg-icon {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 50%;
  margin-bottom: 20px;
  box-shadow:
    0 0 15px rgba(255, 215, 0, 0.5),
    0 0 40px rgba(255, 215, 0, 0.2);
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #070707;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 55px 20px 35px;
  border-bottom: 2px solid #d4af37;
}

.logo {
  font-size: 34px;
  font-weight: 900;
  color: #ffd700;
  letter-spacing: 2px;
  text-shadow:
    0 0 10px #b8860b,
    0 0 25px #6d5700;
}

.sub {
  margin-top: 12px;
  color: #aaa;
  font-size: 14px;
}

.games {
  max-width: 600px;
  margin: auto;
  padding: 35px 20px;
}

.game {
  background: #111;
  border: 1px solid #333;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 20px;
  text-align: left;
}

.number {
  color: #ffd700;
  font-size: 12px;
  letter-spacing: 2px;
}

.game h2 {
  margin: 8px 0;
  font-size: 22px;
}

.game p {
  color: #999;
  font-size: 14px;
}

.play {
  display: block;
  margin-top: 18px;
  padding: 14px;
  text-align: center;
  text-decoration: none;
  border-radius: 10px;
  background: #ffd700;
  color: #000;
  font-weight: bold;
}

.locked {
  opacity: 0.45;
}

.coming {
  display: block;
  margin-top: 18px;
  padding: 14px;
  text-align: center;
  border: 1px solid #555;
  border-radius: 10px;
  color: #777;
}

footer {
  color: #555;
  font-size: 12px;
  padding: 40px 20px;
}
</style>
</head>

<body>

<header>

  <img
  src="095C5945-3A99-43DD-A416-9029AEA09051.png"
  alt="GOLDEN BOTTLE GAMES"
  class="gbg-icon"
>
  <div class="logo">
    GOLDEN<br>
    BOTTLE GAMES
  </div>

  <div class="sub">
    SMALL GAMES. BIG FUN.
  </div>

</header>


<main class="games">

  <div class="game">

    <div class="number">
      GAME 001
    </div>

    <h2>
      🔥 30秒タップチャレンジ
    </h2>

    <p>
      30秒間、限界まで連打せよ。
    </p>

    <a
      class="play"
      href="games/tap/"
    >
      ▶ PLAY
    </a>

  </div>


  <div class="game locked">

    <div class="number">
      GAME 002
    </div>

    <h2>
      ？？？
    </h2>

    <p>
      NEXT GAME
    </p>

    <div class="coming">
      COMING SOON
    </div>

  </div>


  <div class="game locked">

    <div class="number">
      GAME 003
    </div>

    <h2>
      ？？？
    </h2>

    <p>
      NEXT GAME
    </p>

    <div class="coming">
      COMING SOON
    </div>

  </div>

</main>


<footer>

  © 2026 GOLDEN BOTTLE GAMES

  <br><br>

  PLAY • CREATE • ENJOY

</footer>

</body>
</html>
